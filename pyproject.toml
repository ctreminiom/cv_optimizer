[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-optimizer"
version = "0.2.0"
description = "CrewAI multi-agent pipeline that adapts a master CV to job postings and searches LATAM job boards."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CV Optimizer contributors" }]
keywords = ["crewai", "ats", "resume", "cv", "job-search", "agents", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "crewai[anthropic]>=0.80.0",
    "crewai-tools>=0.17.0",
    "anthropic>=0.40.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "questionary>=2.0.0",
    "tenacity>=8.5.0",
    "structlog>=24.1.0",
    "PyYAML>=6.0.0",
    "trafilatura>=1.12.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.6.9",
    "pre-commit>=3.7.0",
    "detect-secrets>=1.5.0",
]
embeddings-openai = ["openai>=1.40.0"]
embeddings-voyage = ["voyageai>=0.3.0"]
tracing = ["langfuse>=2.50.0"]

[project.scripts]
cv-optimizer = "main:main"

[project.urls]
Homepage = "https://github.com/ctreminiom/cv_optimizer"
Issues = "https://github.com/ctreminiom/cv_optimizer/issues"
Changelog = "https://github.com/ctreminiom/cv_optimizer/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src" = ["knowledge_bases/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "private", "cache", "output", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",    # line length handled by formatter
    "SIM102",  # nested if — sometimes clearer than collapsed
    "SIM117",  # nested with — sometimes clearer than collapsed
    "SIM222",  # `x or True` — used as explicit sentinel comments in tests
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
